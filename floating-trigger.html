<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepSeek 悬浮触发条</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #ffffff; }
  #strip {
    position: fixed;
    inset: 0;
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background: #ffffff;
    border-left: 1px solid rgba(15, 23, 42, 0.12);
    box-shadow: -3px 0 10px rgba(2, 6, 23, 0.12);
    cursor: pointer;
    user-select: none;
    transition: background .15s ease;
  }
  #strip:hover { background: #f5f5f5; }
  #grip { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  #grip span {
    width: 5px; height: 5px; border-radius: 50%;
    background: #94a3b8;
  }
  @media (prefers-reduced-motion: reduce) {
    #strip { transition: none; }
  }
</style>
</head>
<body>
<div id="strip" title="点击打开 DeepSeek 悬浮板">
  <div id="grip"><span></span><span></span><span></span></div>
</div>
<script>
  /* The shell handles edge-proximity reveal and window show/hide;
     this page only handles the deliberate click → open/close. */
  const strip = document.getElementById('strip')
  strip.addEventListener('click', () => {
    if (window.dshFloating) window.dshFloating.toggle()
  })
</script>
</body>
</html>
